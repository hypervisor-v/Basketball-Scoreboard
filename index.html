<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="scoreboard">
            
            <!-- HOME Section -->
            <div class="team">
                <h3 class="team-name">HOME</h3>
                <div class="display">
                    <div class="score-text" id="home-score">0</div>
                </div>
                <div class="buttons">
                    <button class="btn" onclick="addHome(1)">+1</button>
                    <button class="btn" onclick="addHome(2)">+2</button>
                    <button class="btn" onclick="addHome(3)">+3</button>
                </div>
            </div>
            
            <!-- GUEST Section -->
            <div class="team">
                <h3 class="team-name">GUEST</h3>
                <div class="display">
                    <div class="score-text" id="guest-score">0</div>
                </div>
                <div class="buttons">
                    <button class="btn" onclick="addGuest(1)">+1</button>
                    <button class="btn" onclick="addGuest(2)">+2</button>
                    <button class="btn" onclick="addGuest(3)">+3</button>
                </div>
            </div>
            
        </div>
        <script src="index.js"></script>
    </body>
</html>
